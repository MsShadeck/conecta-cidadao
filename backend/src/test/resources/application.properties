# Testes automatizados: banco H2 em memória no modo MySQL, criado a partir das entidades.
spring.datasource.url=jdbc:h2:mem:conecta;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=256

app.jwt.segredo=segredo-so-para-os-testes-com-mais-de-32-caracteres
app.jwt.validade-horas=1
app.admin.email=admin@conecta.test
app.admin.senha=senha-do-admin-123
app.cors.origens=http://localhost:5173
