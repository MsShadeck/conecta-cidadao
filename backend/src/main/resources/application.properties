spring.application.name=conecta-cidadao-api
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Banco: MySQL / MariaDB do XAMPP. Crie o banco antes com os scripts de ../database
# (01-criacao.sql e 02-carga-dados.sql). Usuário e senha vêm de variáveis de ambiente.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/conecta_cidadao?serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}

# O esquema é dos scripts SQL (com CHECK, ENUM e ON DELETE): o Hibernate NÃO cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Carrega as listas dos locais (telefones, horários...) em lotes, sem uma consulta por local.
spring.jpa.properties.hibernate.default_batch_fetch_size=256
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ---------------------------------------------------------------------------
# Segurança
# ---------------------------------------------------------------------------
# Chave dos tokens (mínimo 32 caracteres). Sem ela, a API gera uma chave aleatória a cada início.
app.jwt.segredo=${JWT_SEGREDO:}
app.jwt.validade-horas=8
# Primeiro administrador (criado ao iniciar se ainda não existir). Sem as variáveis, nenhum é criado.
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
# Origens do site que podem chamar a API (separadas por vírgula).
app.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:4173}

# Respostas de erro sem detalhes internos
server.error.include-message=never
server.error.include-stacktrace=never
