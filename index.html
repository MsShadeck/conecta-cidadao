<!doctype html>
<!--
  index.html — Única página HTML do projeto.

  O site é uma SPA (Single Page Application): o navegador carrega este arquivo
  uma vez e, a partir daí, o React troca o conteúdo da <div id="root"> conforme
  a rota. O lang="pt-br" informa o idioma a leitores de tela e buscadores.
-->
<html lang="pt-br">
  <head>
    <!-- Acentuação correta (á, ç, ã). -->
    <meta charset="UTF-8" />
    <!-- Responsividade: faz o celular usar a largura real da tela em vez de
         simular um monitor e diminuir tudo. Sem esta linha o CSS responsivo
         não funciona no celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título padrão da aba; as páginas o substituem pelo hook useMetadados. -->
    <title>Conecta Cidadão — Serviços públicos de Indaiatuba</title>

    <!-- Descrição usada por buscadores e por prévias de link em redes sociais. -->
    <meta
      name="description"
      content="Guia não oficial dos serviços públicos de Indaiatuba/SP: postos de saúde, escolas, segurança, lazer, ônibus e serviços online, com endereço, telefone e como chegar."
    />

    <!-- Colore a barra do navegador no celular com o azul da marca (#1a6faf).
         O valor antigo (#c9e8f5) era a cor de fundo, não a da marca. -->
    <meta name="theme-color" content="#1a6faf" />

    <!-- Ícones: favicon da aba, ícone da tela inicial do iPhone e manifest do PWA
         (nome, cores e ícones usados quando o site é "instalado" no celular). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph: título, texto e imagem da prévia quando o link é compartilhado
         no WhatsApp, Facebook etc. A imagem precisa de endereço completo (com https). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Conecta Cidadão" />
    <meta property="og:title" content="Conecta Cidadão — Serviços públicos de Indaiatuba" />
    <meta
      property="og:description"
      content="Postos de saúde, escolas, segurança, lazer, ônibus e serviços online de Indaiatuba/SP em um só lugar."
    />
    <meta property="og:url" content="https://conecta-cidadao.vercel.app/" />
    <meta
      property="og:image"
      content="https://conecta-cidadao.vercel.app/img/interface/og-imagem.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- preconnect: abre a conexão com o Google Fonts antes de a fonte ser
         pedida, reduzindo o tempo de carregamento. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonte Poppins nos pesos usados no projeto (400, 500 e 600).
         display=swap mostra uma fonte substituta enquanto a Poppins carrega,
         evitando texto invisível. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Mensagem para quem está com o JavaScript desligado. -->
    <noscript>
      O Conecta Cidadão precisa do JavaScript ligado. Telefones de emergência: SAMU 192, Polícia
      Militar 190, Bombeiros 193.
    </noscript>
    <!-- Contêiner vazio: todo o conteúdo é inserido aqui pelo React
         (ver createRoot em src/main.jsx). -->
    <div id="root"></div>
    <!-- type="module" permite import/export no navegador; o Vite processa
         este arquivo e gera o pacote final na build. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
